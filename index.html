<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/shamiComposer/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="shamiComposer is a free shamisen notation editor that runs in your browser. Write bunkafu tablature with techniques, kamashi and triplets, then print it or back it up to Google Drive.">
  <!-- Shown when a link is shared. https://cstoffel.github.io/shamiComposer/ is filled in by the CI
       build (.github/workflows/build.yaml) with the site's address. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="shamiComposer">
  <meta property="og:title" content="shamiComposer: shamisen notation editor">
  <meta property="og:description" content="shamiComposer is a free shamisen notation editor that runs in your browser. Write bunkafu tablature with techniques, kamashi and triplets, then print it or back it up to Google Drive.">
  <meta property="og:url" content="https://cstoffel.github.io/shamiComposer/">
  <meta property="og:image" content="https://cstoffel.github.io/shamiComposer/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="shamiComposer: a free shamisen notation editor for your browser">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shamiComposer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>shamiComposer</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "3138465062" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
